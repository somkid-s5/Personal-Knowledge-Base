version: '3.8'
services:
  backstage:
    image: backstage-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - APP_CONFIG_app_baseUrl=http://localhost:3000
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    volumes:
      - ./app-config.yaml:/app/app-config.yaml
