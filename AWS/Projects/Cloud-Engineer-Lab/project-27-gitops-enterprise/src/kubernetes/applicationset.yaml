apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: workload-clusters
  namespace: argocd
spec:
  generators:
  - list:
      elements:
      - cluster: dev-cluster
        url: https://dev.k8s.local
        env: dev
      - cluster: staging-cluster
        url: https://staging.k8s.local
        env: staging
      - cluster: prod-cluster
        url: https://prod.k8s.local
        env: prod
  template:
    metadata:
      name: '{{cluster}}-base-config'
    spec:
      project: default
      source:
        repoURL: https://github.com/techwave/gitops-repo.git
        targetRevision: HEAD
        path: clusters/{{env}}/base
      destination:
        server: '{{url}}'
        namespace: kube-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
