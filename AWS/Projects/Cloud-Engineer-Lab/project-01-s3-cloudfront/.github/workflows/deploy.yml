name: Deploy Static Website

on:
  push:
    branches:
      - main
    paths:
      - 'project-01-s3-cloudfront/src/app/**'
      - 'project-01-s3-cloudfront/src/terraform/**'
  workflow_dispatch: # Allow manual trigger

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-southeast-1
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActionsDeployment

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: project-01-s3-cloudfront/src/terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: project-01-s3-cloudfront/src/terraform
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: project-01-s3-cloudfront/src/terraform
        run: terraform apply -auto-approve tfplan

      - name: Get Terraform Outputs
        id: outputs
        working-directory: project-01-s3-cloudfront/src/terraform
        run: |
          echo "S3_BUCKET=$(terraform output -raw s3_bucket_name)" >> $GITHUB_OUTPUT
          echo "CLOUDFRONT_ID=$(terraform output -raw distribution_id)" >> $GITHUB_OUTPUT

      - name: Deploy to S3
        run: |
          aws s3 sync project-01-s3-cloudfront/src/app/ s3://${{ steps.outputs.outputs.S3_BUCKET }} --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ steps.outputs.outputs.CLOUDFRONT_ID }} --paths "/*"
