# Loki Helm Values for S3 Storage

loki:
  auth_enabled: false
  
  commonConfig:
    replication_factor: 3
    path_prefix: /var/loki
  
  storage:
    type: s3
    s3:
      bucketnames: my-loki-logs-bucket
      region: ap-southeast-1
  
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: index_
          period: 24h

  limits_config:
    retention_period: 720h # 30 days
    reject_old_samples: true
    reject_old_samples_max_age: 168h

compactor:
  working_directory: /var/loki/compactor
  shared_store: s3
  retention_enabled: true

# Use distributed mode for production
deploymentMode: Distributed

ingester:
  replicas: 3
querier:
  replicas: 3
distributor:
  replicas: 2
