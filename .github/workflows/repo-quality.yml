name: Repository Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structure:
    name: Validate repository structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate canonical knowledge-base structure
        run: python .github/scripts/validate_repo_structure.py

  internal-links:
    name: Validate internal Markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate local Markdown targets
        run: python .github/scripts/validate_internal_links.py

  markdown:
    name: Lint governance Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24


  az104-payload:
    name: Validate AZ-104 packed study payload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Decode and inventory AZ-104 learning payload
        run: python Azure/Certifications/AZ-104/tools/audit_payload.py


  aws-project-track:
    name: Validate AWS project workbooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Audit Cloud Engineer Lab project contract
        run: python AWS/Projects/Cloud-Engineer-Lab/tools/audit_projects.py


  saa-provenance:
    name: Validate SAA-C03 practice provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Guard canonical SAA practice layer
        run: python AWS/Certifications/SAA-C03/tools/audit_provenance.py
