name: Oracle Knowledge Base QA

on:
  push:
    paths:
      - 'Oracle-Database/**'
      - '.github/workflows/oracle-kb-qa.yml'
  pull_request:
    paths:
      - 'Oracle-Database/**'
      - '.github/workflows/oracle-kb-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-oracle-knowledge-base:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify Python available
        run: python3 --version
      - name: Check lesson inventory, lab names and internal links
        run: python3 Oracle-Database/qa/validate_kb.py
      - name: Validate read-only sandbox scripts and evidence contract
        run: python3 Oracle-Database/qa/validate_sandbox.py
      - name: Validate offline expected-vs-actual manifest safety
        run: python3 Oracle-Database/qa/assess_sandbox_evidence.py
