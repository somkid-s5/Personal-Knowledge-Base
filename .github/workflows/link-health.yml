name: Documentation Link Health

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --root-dir "${{ github.workspace }}"
            --no-progress
            --cache
            './**/*.md'
          fail: false
          jobSummary: true
          token: ${{ secrets.GITHUB_TOKEN }}
