apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-conf
  namespace: observability
data:
  otel-collector-config: |
    receivers:
      otlp:
        protocols:
          grpc:
          http:
    processors:
      batch:
      memory_limiter:
        limit_mib: 1536
        spike_limit_mib: 512
        check_interval: 5s
    exporters:
      awsxray:
        region: ap-southeast-1
      awsemf:
        region: ap-southeast-1
        log_group_name: "/aws/containerinsights/thaidemo-eks/performance"
        log_stream_name: "otel-stream"
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [awsxray]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [awsemf]
