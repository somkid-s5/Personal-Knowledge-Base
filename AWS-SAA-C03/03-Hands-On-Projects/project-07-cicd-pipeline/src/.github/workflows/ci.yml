name: CI Pipeline

on:
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov ruff mypy
          if [ -f src/app/requirements.txt ]; then pip install -r src/app/requirements.txt; fi
          
      - name: Lint with Ruff
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          ruff check . --select=E9,F63,F7,F82 --show-source
          # default statistics
          ruff check . --exit-zero
          
      - name: Type check with mypy
        run: |
          mypy src/app/ || true # don't fail CI if app isn't perfectly typed yet
          
      - name: Test with pytest
        run: |
          # Create a dummy test file if none exists for the lab
          mkdir -p tests
          echo "def test_dummy(): assert True" > tests/test_dummy.py
          pytest --cov=src/app tests/

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner on Repo
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  terraform-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/terraform
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        
      - name: Terraform Format
        run: terraform fmt -check
        
      - name: Terraform Init
        run: terraform init -backend=false
        
      - name: Terraform Validate
        run: terraform validate
