apiVersion: backstage.io/v1alpha1
kind: Template
metadata:
  name: flask-service-template
  title: Flask Service Template
  description: A production-ready Flask service with Docker and CI/CD.
spec:
  owner: cloud-engineer-team
  type: service

  parameters:
    - title: Service Info
      required:
        - name
      properties:
        name:
          title: Name
          type: string
          description: Unique name of the service
        description:
          title: Description
          type: string
          description: A brief description of the service

  steps:
    - id: fetch-base
      name: Fetch Base
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}

    - id: publish
      name: Publish
      action: publish:github
      input:
        allowedHosts: ['github.com']
        description: This is ${{ parameters.name }}
        repoUrl: github.com?owner=your-org&repo=${{ parameters.name }}

    - id: register
      name: Register
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
