<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="environment" content="production">
    <title>Investor Demo - ThaiDemo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            text-align: center;
        }
        h1 { margin-bottom: 0.5rem; }
        .timestamp { font-size: 1.2rem; margin-top: 1rem; color: #ffd700; }
        .env-tag {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            background: #48bb78;
            border-radius: 5px;
            font-size: 0.8rem;
            margin-top: 1rem;
        }
        a { color: #63b3ed; text-decoration: none; margin-top: 1rem; display: block; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to ThaiDemo 🚀</h1>
        <p>This site is served via S3 + CloudFront.</p>
        
        <div id="env" class="env-tag">Environment: </div>
        
        <div class="timestamp" id="time"></div>
        
        <a href="health.html">Check Status</a>
    </div>

    <script>
        // Set environment from meta tag
        const env = document.querySelector('meta[name="environment"]').content;
        document.getElementById('env').innerText += env.toUpperCase();

        // Update timestamp
        function updateTime() {
            const now = new Date();
            document.getElementById('time').innerText = now.toLocaleString();
        }
        setInterval(updateTime, 1000);
        updateTime();
    </script>
</body>
</html>
