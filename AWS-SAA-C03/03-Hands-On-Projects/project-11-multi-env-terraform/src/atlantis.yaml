version: 3
automerge: false
parallel_plan: true
parallel_apply: false
projects:
- name: dev-networking
  dir: src/terragrunt/dev/networking
  workspace: dev
  autoplan:
    when_modified: ["*.hcl", "*.tf"]
    enabled: true
  workflow: terragrunt

- name: staging-networking
  dir: src/terragrunt/staging/networking
  workspace: staging
  autoplan:
    when_modified: ["*.hcl", "*.tf"]
    enabled: true
  workflow: terragrunt

workflows:
  terragrunt:
    plan:
      steps:
      - env:
          name: TERRAGRUNT_TFPATH
          command: 'echo "terraform"'
      - run: terragrunt plan -no-color -out $PLANFILE
    apply:
      steps:
      - run: terragrunt apply -no-color $PLANFILE
