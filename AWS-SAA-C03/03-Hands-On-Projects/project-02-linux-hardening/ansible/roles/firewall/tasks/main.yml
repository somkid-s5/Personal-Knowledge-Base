---
- name: Set UFW default policies
  ufw:
    policy: deny
    direction: incoming

- name: Allow SSH port (22)
  ufw:
    rule: allow
    port: 22
    proto: tcp

- name: Allow Web traffic (HTTP/HTTPS)
  ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - 80
    - 443

- name: Enable UFW
  ufw:
    state: enabled
    logging: on
